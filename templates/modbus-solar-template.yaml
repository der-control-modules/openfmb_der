---
file:
  id: modbus-solar-template
  edition: "2.1"
  version: "1.0.0"
  plugin: "modbus-master"

master:
  channel:
    type: tcp-client
    tcp-client:
      adapter: "192.168.1.100"
      port: 502
      connect-timeout-ms: 5000
  
  session:
    response-timeout-ms: 5000
    max-read-request-size: 100
    device-map:
      - unit-identifier: 1
        profiles:
          - name: SolarReadingProfile
            mRID: "1e740843-fcf2-4dcb-a1f0-6bd48958ca14"
            mapping:
              - name: "SolarInverter"
                type: "SolarInverter"
                conducting-equipment:
                  mRID: "1e740843-fcf2-4dcb-a1f0-6bd48958ca14"
                  name: "Solar Inverter 1"
                  description: "Solar inverter connected via Modbus"
                reading-data:
                  - name: "ActivePower"
                    register-type: holding
                    address: 40001
                    register-count: 2
                    data-type: float32
                    scale: 1.0
                    unit: "W"
                    profile-mapping: "solarReading.readingMMXU.W.net.cVal.mag.f.value"
                  - name: "ReactivePower"
                    register-type: holding
                    address: 40003
                    register-count: 2
                    data-type: float32
                    scale: 1.0
                    unit: "VAR"
                    profile-mapping: "solarReading.readingMMXU.VAr.net.cVal.mag.f.value"
                  - name: "Voltage"
                    register-type: holding
                    address: 40005
                    register-count: 2
                    data-type: float32
                    scale: 1.0
                    unit: "V"
                    profile-mapping: "solarReading.readingMMXU.PhV.phsA.cVal.mag.f.value"
                  - name: "Current"
                    register-type: holding
                    address: 40007
                    register-count: 2
                    data-type: float32
                    scale: 1.0
                    unit: "A"
                    profile-mapping: "solarReading.readingMMXU.A.phsA.cVal.mag.f.value"
          - name: SolarStatusProfile
            mRID: "1e740843-fcf2-4dcb-a1f0-6bd48958ca14"
            mapping:
              - name: "SolarInverter"
                type: "SolarInverter"
                conducting-equipment:
                  mRID: "1e740843-fcf2-4dcb-a1f0-6bd48958ca14"
                  name: "Solar Inverter 1"
                status-data:
                  - name: "InverterStatus"
                    register-type: discrete-input
                    address: 10001
                    register-count: 1
                    data-type: bool
                    profile-mapping: "solarStatus.solarStatusZGEN.SolarStatusZGEN.DynamicTest.stVal"
