plugins:
  - name: mqtt-publisher
    path: ./mqtt-publisher.so
    config:
      broker: { host: localhost, port: 1883 }
      topic_prefix: openfmb
      client_id: openfmb-switch-client

sessions:
  - session:
      channel: { name: channel, adapter: "192.168.1.100", port: 502 }
      timeout: 5000
      profile:
        - name: "switch_profile"
          mRID: "generated-mrid"
          unitId: 1
          integrity_period: 5000